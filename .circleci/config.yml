version: 2.1

jobs:
  build:
    docker:
      - image: paperist/texlive-ja:2025-alpine
    steps:
      # git and ssh have to be present before `checkout` runs, otherwise
      # CircleCI falls back to its own git client, which cannot authenticate
      # against GitHub with the project's deploy key.
      - run: apk update && apk add git openssh-client python3 py3-pip
      # Alpine enforces PEP 668, so pip refuses to install into the system
      # interpreter. Prefer the distro package; fall back to pip only if this
      # image's Alpine release does not carry aws-cli.
      - run: apk add aws-cli || pip3 install --break-system-packages awscli
      - run: tlmgr install fontawesome fontawesome5 multibib
      - checkout
      - run: latexmk cv.tex
      - run:
          name: Deploy to S3
          command: aws s3 cp cv.pdf s3://keichi.net/cv_takahashi.pdf

workflows:
  build-and-deploy:
    jobs:
      - build
